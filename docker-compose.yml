services:
  # DB
  alope-db:
    image: postgres:15-alpine
    container_name: alope_db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=alope_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # CACHE
  redis:
    image: redis:alpine
    container_name: alope_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend: Auth Service
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      alope-db:
        condition: service_healthy
    environment:
      - PORT=8081
      - DB_HOST=alope_db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=alope-course

  # Backend: Course Service
  course-service:
    build: ./backend/course-service
    ports:
      - "8083:8080"
    depends_on:
      alope-db:
        condition: service_healthy
    environment:
      - PORT=8080
      - DB_HOST=alope-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=alope-course

  # Backend: CMS Service
  cms-service:
    build:
      context: ./backend/cms-service
      dockerfile: Dockerfile
    container_name: cms_service
    ports:
      - "8082:8082"
    depends_on:
      alope-db:
        condition: service_healthy
    environment:
      - PORT=8082
      - DB_HOST=alope-db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE=alope_db
      - DB_PORT=5432
      - DB_SSLMODE=disable
      - DB_URL=postgres://postgres:postgres@alope-db:5432/alope_db?sslmode=disable

  # API Gateway
  gateway:
    build: ./backend/gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - course-service
      - cms-service
    environment:
      - GATEWAY_PORT=8080
      - AUTH_SERVICE_URL=http://auth-service:8081
      - COURSE_SERVICE_URL=http://course-service:8080
      - CMS_SERVICE_URL=http://cms-service:8082
      - JWT_SECRET=732a2d8ad20e6bb94f9ce7c87bcc830d6bdb2feb328914506b8398eb7a5a604a

  # Frontend: Alope Course (Next.js)
  alope-course:
    build: ./frontend/alope-course
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api

  # Frontend: Alope Admin
  alope-admin:
    build: ./frontend/alope-admin
    ports:
      - "3001:80"
